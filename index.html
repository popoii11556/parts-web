<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> รายการพัสดุและอัตราการเบิก — คลังพัสดุย่อยฮอทไลน์ กฝช.</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap');
:root{--navy:#0D1B3E;--blue:#1E5FA8;--bg:#F2F5FA;--muted:#64748B;--border:#DDE3EF;--red:#E84646}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans Thai',sans-serif;background:var(--bg);color:#1A1A2E;padding:16px}
.wrap{max-width:900px;margin:0 auto;background:#fff;border:1px solid var(--border);border-radius:16px;overflow:hidden}
.head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.head h1{font-size:1.05rem;color:var(--navy)}
.head small{font-size:.74rem;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{background:#F8FAFD;padding:10px 14px;text-align:left;font-size:.75rem;color:var(--muted);border-bottom:1px solid var(--border);position:sticky;top:0}
td{padding:9px 14px;border-bottom:1px solid #F0F3FA}
tr:hover td{background:#F8FAFD}
.c{text-align:center}
.no{color:var(--muted);font-size:.75rem}
.qty{font-weight:700;color:var(--blue)}
.out{display:inline-block;padding:3px 12px;border-radius:20px;font-size:.74rem;font-weight:700;background:#FEE2E2;color:#991B1B}
.pg{padding:12px 16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;border-top:1px solid var(--border);font-size:.78rem;color:var(--muted)}
.pg button{padding:5px 12px;border:1px solid var(--border);border-radius:7px;background:#fff;cursor:pointer;font-family:inherit;font-size:.8rem;min-width:34px}
.pg button:hover:not(:disabled){border-color:var(--blue)}
.pg button:disabled{opacity:.4;cursor:not-allowed}
.pg button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.imgbtn{padding:4px 12px;border:1px solid var(--blue);border-radius:20px;background:#fff;color:var(--blue);font-family:inherit;font-size:.76rem;font-weight:600;cursor:pointer}
.imgbtn:hover{background:var(--blue);color:#fff}
.noimg{color:#cbd5e1;font-size:.8rem}
#lb{display:none;position:fixed;inset:0;background:rgba(13,27,62,.7);z-index:50;align-items:center;justify-content:center;padding:16px}
#lb .box{background:#fff;border-radius:16px;max-width:min(720px,100%);max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
#lb .bh{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--border);font-weight:700;font-size:.9rem;color:var(--navy)}
#lb .bh button{border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
#lb .bb{padding:14px;overflow:auto;text-align:center}
#lb img{max-width:100%;max-height:70vh;border-radius:8px}
.msg{padding:18px;text-align:center;color:var(--muted);font-size:.85rem}
@media(max-width:600px){body{padding:8px}th,td{padding:8px 8px;font-size:.78rem}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><h1 id="ttl">พัสดุที่เบิกได้และจำนวนต่อครั้ง — คลังย่อยฮอทไลน์ กฝช.</h1><small id="upd">กำลังโหลด...</small></div>
  <table>
    <thead><tr><th style="width:44px">#</th><th>รายการ</th><th class="c" style="width:130px">เบิกได้/ต่อครั้ง</th><th class="c" style="width:110px">รูปภาพ</th><th class="c" style="width:130px">สถานะ</th></tr></thead>
    <tbody id="body"><tr><td colspan="5" class="msg">กำลังโหลดข้อมูล...</td></tr></tbody>
  </table>
  <div class="pg" id="pg"></div>
</div>
<div id="lb" onclick="if(event.target===this)closeLb()"><div class="box"><div class="bh"><span id="lbT"></span><button onclick="closeLb()" aria-label="ปิด">✕</button></div><div class="bb"><img id="lbI" alt=""><div id="lbE" class="msg" style="display:none">โหลดรูปไม่สำเร็จ</div></div></div></div>
<script>
// ---- ตั้งค่า ----
const SHEET_ID = '1WrS4_vSwPZlRpyhgDhE2_WwW5-wZrmGelnm9rAcCI4Q';
const INVENTORY_GID = 959940374;          // แท็บ "แสดงยอดพัสดุ"
const IMAGE_COLUMN_INDEX = 2;           // คอลัมน์ C (นับ A=0, B=1, C=2) ที่เก็บรูปภาพ
const PAGE_SIZE = 20;                  // แสดงทีละกี่รายการ
const REFRESH_SECONDS = 30;            // รีเฟรชอัตโนมัติทุกกี่วินาที
const ITEMS = [
 "Clamp Stick Head",
 "Clamp Stick Jaw",
 "Clamp Stick Handle",
 "นกล็อค Clamp Stick",
 "ไกล็อค Clamp Stick",
 "Clamp Stick Lock Bar (ราง Clamp Stick)",
 "ปลอกดำรองราง Clamp Stick",
 "ปลอกรัดแส้ Clamp Stick ขนาด 2 นิ้ว",
 "ปลอกรัดแส้ Clamp Stick ขนาด 12 นิ้ว",
 "Adjusting Screw For Clamp Stick (สั้น)",
 "Adjusting Screw For Clamp Stick (ยาว)",
 "Pole Hanger",
 "หมวกปิดด้ามขนาด 1 1/4 นิ้ว (32 mm.)",
 "Epoxy Rod",
 "Wire Cutter Joint For Al or ACSR",
 "Plate For Wire Cutter Head",
 "Stop Lock Ratchet Cutter",
 "Spring Use For Ratchet Cutter",
 "ล้อรางด้ามบังคับ Ratchet Cutter",
 "หัว cutter สาย SAC",
 "หัวข้อต่อ Ratchet Cutter / Ratchet cutter joint",
 "Wire Cutter Head For ACSR (SAP)",
 "Universal Pole Head ขนาด 1-1/4 นิ้ว (32 mm.)",
 "Universal Pole Head ขนาด 1-1/2 นิ้ว (38 mm.)",
 "C - Clamp",
 "Tie Stick Head (Fixed Prong)",
 "Tie Stick Head (Rotary Blade)",
 "Tie Stick Head (Rotary Prong Head)",
 "แผ่นปิดปาก Roller Link Stick",
 "แหวนรองสปริง Saddle",
 "นกล็อค Saddle",
 "มือหมุน Saddle",
 "Insulated Hanger Head",
 "Insulated Hanger Bar",
 "Spliced Disconnect Stick Joint ใหญ่ (Type A)",
 "Spliced Disconnect Stick Joint เล็ก (Type B)",
 "Spliced Disconnect Stick Head",
 "Point Disconnected Head",
 "Coil Spring",
 "ลูกเบี้ยว",
 "มือหมุน Hoist",
 "Release Lever",
 "Actuating Spring (สปริงก้ามปูเล็ก)",
 "สปริงดีด (สปริงก้ามปูใหญ่)",
 "ชุดบังคับสปริง",
 "คานบังคับลูกเบี้ยว",
 "Epoxy Bond Patching Kit",
 "Gloss Restorer",
 "Wiping Cloth",
 "Insulator Cover Hanger",
 "หมวกปิดด้าม ขนาด 1 1/2 นิ้ว (38 mm.)",
 "Snap Pin",
 "เกลียวปรับปาก Wire holding",
 "น็อตล็อค Wire holding",
 "สลักแท่งอลูมิเนียม (แท่ง ALU)",
 "สลักเกลียวทองเหลืองหัว Taper ขนาด 1/4 \" X 1/2\"",
 "Hot Stick Bank Pole ขนาด 38.10 ม.ม.",
 "Blade For PIC Stripper (SAP)",
 "Blade For Cable Stripper (SAP)",
 "Hot Stick Bank Pole ขนาด 38.10 ม.ม. (SAP)",
 "Conductive Gloves (SAP)",
 "Conductive Sock (SAP)"
];
// ----------------
const URL_ = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${INVENTORY_GID}`;
const norm = t => String(t || '').toLowerCase().replace(/[\s\u00A0\u200B]+/g, '');
const esc = x => String(x).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// แปลงค่าในคอลัมน์ C เป็นลิงก์รูป: รองรับลิงก์ตรง, =IMAGE("..."), และลิงก์ Google Drive
function imgUrl(raw) {
  const t = String(raw == null ? '' : raw).trim();
  if (!t) return '';
  const m = t.match(/IMAGE\(\s*"([^"]+)"/i);
  const u = m ? m[1] : t;
  if (!/^https?:\/\//i.test(u)) return '';
  const d = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]+)/);
  return d ? `https://drive.google.com/thumbnail?id=${d[1]}&sz=w1200` : u;
}

function parse(text) {
  const json = JSON.parse(text.slice(text.indexOf('{'), text.lastIndexOf('}') + 1));
  const cols = json.table.cols.map(c => (c.label || c.id || '').trim());
  const rows = (json.table.rows || []).map(r => { const o = {}; cols.forEach((c, i) => { const cell = r.c && r.c[i]; o[c] = cell && cell.v != null ? cell.v : ''; }); return o; });
  const k = rows.length ? Object.keys(rows[0]) : [];
  const itemKey = k.find(x => x === 'รายการ') || k[1];
  const qtyKey  = k.find(x => /จำนวนให้เบิก|ต่อครั้ง/i.test(x)) || k[5];
  const remKey  = k.find(x => x === 'จำนวนคงเหลือ') || k[7];
  const imgKey  = k[IMAGE_COLUMN_INDEX];
  console.log('[img] column C label:', imgKey, '| sample values:', rows.slice(0, 5).map(r => r[imgKey]));
  const map = new Map();
  rows.forEach(r => {
    const name = String(r[itemKey] || '').trim();
    if (!name || name === 'รายการ' || name === 'ลำดับ' || /^\d+$/.test(name)) return;
    if (!map.has(norm(name))) map.set(norm(name), { name, qty: Math.round(Number(r[qtyKey]) || 0), rem: Math.round(Number(r[remKey]) || 0), img: imgUrl(r[imgKey]) });
  });
  return map;
}

let page = 1;
function render(map) {
  const total = Math.max(1, Math.ceil(ITEMS.length / PAGE_SIZE));
  page = Math.min(Math.max(1, page), total);
  const from = (page - 1) * PAGE_SIZE;
  document.getElementById('body').innerHTML = ITEMS.slice(from, from + PAGE_SIZE).map((n, k) => {
    const d = map.get(norm(n));
    return `<tr><td class="no">${from + k + 1}</td><td style="font-weight:600">${esc(d ? d.name : n)}</td>
      <td class="c"><span class="qty">${d && d.qty ? d.qty : '—'}</span></td>
      <td class="c">${d && d.img ? `<button class="imgbtn" data-n="${from + k}">รูปภาพ</button>` : '<span class="noimg">—</span>'}</td>
      <td class="c">${d && d.rem <= 0 ? '<span class="out">หมด</span>' : ''}</td></tr>`;
  }).join('');
  let h = `<span>แสดง ${from + 1}–${Math.min(from + PAGE_SIZE, ITEMS.length)} จาก ${ITEMS.length} รายการ</span>`;
  h += `<button data-p="${page - 1}" ${page === 1 ? 'disabled' : ''}>◀</button>`;
  for (let p = 1; p <= total; p++) h += `<button data-p="${p}" class="${p === page ? 'on' : ''}">${p}</button>`;
  h += `<button data-p="${page + 1}" ${page === total ? 'disabled' : ''}>▶</button>`;
  document.getElementById('pg').innerHTML = h;
}
function closeLb() { document.getElementById('lb').style.display = 'none'; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });
document.getElementById('body').addEventListener('click', e => {
  const b = e.target.closest('button[data-n]'); if (!b || !last) return;
  const n = ITEMS[Number(b.dataset.n)], d = last.get(norm(n)); if (!d || !d.img) return;
  const im = document.getElementById('lbI'), er = document.getElementById('lbE');
  er.style.display = 'none'; im.style.display = '';
  im.onerror = () => { im.style.display = 'none'; er.style.display = ''; };
  im.src = d.img;
  document.getElementById('lbT').textContent = d.name;
  document.getElementById('lb').style.display = 'flex';
});
document.getElementById('pg').addEventListener('click', e => {
  const b = e.target.closest('button[data-p]'); if (!b || b.disabled || !last) return;
  page = Number(b.dataset.p); render(last);
});

let last = null;
async function load() {
  try {
    const r = await fetch(URL_ + '&_=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    last = parse(await r.text());
    render(last);
    document.getElementById('upd').textContent = 'อัปเดตล่าสุด ' + new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  } catch (e) {
    console.error(e);
    if (!last) document.getElementById('body').innerHTML = '<tr><td colspan="5" class="msg">โหลดข้อมูลไม่สำเร็จ — ตรวจสอบว่า Sheet แชร์แบบ "ทุกคนที่มีลิงก์ดูได้"</td></tr>';
    document.getElementById('upd').textContent = 'เชื่อมต่อไม่ได้ จะลองใหม่อัตโนมัติ';
  }
}
load();
setInterval(load, REFRESH_SECONDS * 1000);
</script>
</body>
</html>
