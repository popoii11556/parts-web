<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รายการพัสดุ กฝช.</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap');
:root{--navy:#0D1B3E;--blue:#1E5FA8;--bg:#F2F5FA;--muted:#64748B;--border:#DDE3EF;--red:#E84646}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans Thai',sans-serif;background:var(--bg);color:#1A1A2E;padding:16px}
.wrap{max-width:900px;margin:0 auto;background:#fff;border:1px solid var(--border);border-radius:16px;overflow:hidden}
.head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.head h1{font-size:1.05rem;color:var(--navy)}
.head small{font-size:.74rem;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{background:#F8FAFD;padding:10px 14px;text-align:left;font-size:.75rem;color:var(--muted);border-bottom:1px solid var(--border);position:sticky;top:0}
td{padding:9px 14px;border-bottom:1px solid #F0F3FA}
tr:hover td{background:#F8FAFD}
.c{text-align:center}
.no{color:var(--muted);font-size:.75rem}
.qty{font-weight:700;color:var(--blue)}
.out{display:inline-block;padding:3px 12px;border-radius:20px;font-size:.74rem;font-weight:700;background:#FEE2E2;color:#991B1B}
.msg{padding:18px;text-align:center;color:var(--muted);font-size:.85rem}
@media(max-width:600px){body{padding:8px}th,td{padding:8px 8px;font-size:.78rem}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><h1>รายการพัสดุ กฝช.</h1><small id="upd">กำลังโหลด...</small></div>
  <table>
    <thead><tr><th style="width:44px">#</th><th>รายการ</th><th class="c" style="width:130px">เบิกได้/ต่อครั้ง</th><th class="c" style="width:150px">สถานะ</th></tr></thead>
    <tbody id="body"><tr><td colspan="4" class="msg">กำลังโหลดข้อมูล...</td></tr></tbody>
  </table>
</div>
<script>
// ---- ตั้งค่า ----
const SHEET_ID = '1WrS4_vSwPZlRpyhgDhE2_WwW5-wZrmGelnm9rAcCI4Q';
const INVENTORY_GID = 959940374;          // แท็บ "แสดงยอดพัสดุ"
const REFRESH_SECONDS = 30;            // รีเฟรชอัตโนมัติทุกกี่วินาที
const ITEMS = [
 "Clamp Stick Head",
 "Clamp Stick Jaw",
 "Clamp Stick Handle",
 "นกล็อค Clamp Stick",
 "ไกล็อค Clamp Stick",
 "Clamp Stick Lock Bar (ราง Clamp Stick)",
 "ปลอกดำรองราง Clamp Stick",
 "ปลอกรัดแส้ Clamp Stick ขนาด 2 นิ้ว",
 "ปลอกรัดแส้ Clamp Stick ขนาด 12 นิ้ว",
 "Adjusting Screw For Clamp Stick (สั้น)",
 "Adjusting Screw For Clamp Stick (ยาว)",
 "Pole Hanger",
 "หมวกปิดด้ามขนาด 1 1/4 นิ้ว (32 mm.)",
 "Epoxy Rod",
 "Wire Cutter Joint For Al or ACSR",
 "Plate For Wire Cutter Head",
 "Stop Lock Ratchet Cutter",
 "Spring Use For Ratchet Cutter",
 "ล้อรางด้ามบังคับ Ratchet Cutter",
 "หัว cutter สาย SAC",
 "หัวข้อต่อ Ratchet Cutter / Ratchet cutter joint",
 "Wire Cutter Head For ACSR (SAP)",
 "Universal Pole Head ขนาด 1-1/4 นิ้ว (32 mm.)",
 "Universal Pole Head ขนาด 1-1/2 นิ้ว (38 mm.)",
 "C - Clamp",
 "Tie Stick Head (Fixed Prong)",
 "Tie Stick Head (Rotary Blade)",
 "Tie Stick Head (Rotary Prong Head)",
 "แผ่นปิดปาก Roller Link Stick",
 "แหวนรองสปริง Saddle",
 "นกล็อค Saddle",
 "มือหมุน Saddle",
 "Insulated Hanger Head",
 "Insulated Hanger Bar",
 "Spliced Disconnect Stick Joint ใหญ่ (Type A)",
 "Spliced Disconnect Stick Joint เล็ก (Type B)",
 "Spliced Disconnect Stick Head",
 "Point Disconnected Head",
 "Coil Spring",
 "ลูกเบี้ยว",
 "มือหมุน Hoist",
 "Release Lever",
 "Actuating Spring (สปริงก้ามปูเล็ก)",
 "สปริงดีด (สปริงก้ามปูใหญ่)",
 "ชุดบังคับสปริง",
 "คานบังคับลูกเบี้ยว",
 "Epoxy Bond Patching Kit",
 "Gloss Restorer",
 "Wiping Cloth",
 "Insulator Cover Hanger",
 "หมวกปิดด้าม ขนาด 1 1/2 นิ้ว (38 mm.)",
 "Snap Pin",
 "เกลียวปรับปาก Wire holding",
 "น็อตล็อค Wire holding",
 "สลักแท่งอลูมิเนียม (แท่ง ALU)",
 "สลักเกลียวทองเหลืองหัว Taper ขนาด 1/4 \" X 1/2\"",
 "Hot Stick Bank Pole ขนาด 38.10 ม.ม.",
 "Blade For PIC Stripper (SAP)",
 "Blade For Cable Stripper (SAP)",
 "Hot Stick Bank Pole ขนาด 38.10 ม.ม. (SAP)",
 "Conductive Gloves (SAP)",
 "Conductive Sock (SAP)"
];
// ----------------
const URL_ = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${INVENTORY_GID}`;
const norm = t => String(t || '').toLowerCase().replace(/[\s\u00A0\u200B]+/g, '');
const esc = x => String(x).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function parse(text) {
  const json = JSON.parse(text.slice(text.indexOf('{'), text.lastIndexOf('}') + 1));
  const cols = json.table.cols.map(c => (c.label || c.id || '').trim());
  const rows = (json.table.rows || []).map(r => { const o = {}; cols.forEach((c, i) => { const cell = r.c && r.c[i]; o[c] = cell && cell.v != null ? cell.v : ''; }); return o; });
  const k = rows.length ? Object.keys(rows[0]) : [];
  const itemKey = k.find(x => x === 'รายการ') || k[1];
  const qtyKey  = k.find(x => /จำนวนให้เบิก|ต่อครั้ง/i.test(x)) || k[5];
  const remKey  = k.find(x => x === 'จำนวนคงเหลือ') || k[7];
  const map = new Map();
  rows.forEach(r => {
    const name = String(r[itemKey] || '').trim();
    if (!name || name === 'รายการ' || name === 'ลำดับ' || /^\d+$/.test(name)) return;
    if (!map.has(norm(name))) map.set(norm(name), { name, qty: Math.round(Number(r[qtyKey]) || 0), rem: Math.round(Number(r[remKey]) || 0) });
  });
  return map;
}

function render(map) {
  document.getElementById('body').innerHTML = ITEMS.map((n, i) => {
    const d = map.get(norm(n));
    return `<tr><td class="no">${i + 1}</td><td style="font-weight:600">${esc(d ? d.name : n)}</td>
      <td class="c"><span class="qty">${d && d.qty ? d.qty : '—'}</span></td>
      <td class="c">${d && d.rem <= 0 ? '<span class="out">หมด</span>' : ''}</td></tr>`;
  }).join('');
}

let last = null;
async function load() {
  try {
    const r = await fetch(URL_ + '&_=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    last = parse(await r.text());
    render(last);
    document.getElementById('upd').textContent = 'อัปเดตล่าสุด ' + new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  } catch (e) {
    console.error(e);
    if (!last) document.getElementById('body').innerHTML = '<tr><td colspan="4" class="msg">โหลดข้อมูลไม่สำเร็จ — ตรวจสอบว่า Sheet แชร์แบบ "ทุกคนที่มีลิงก์ดูได้"</td></tr>';
    document.getElementById('upd').textContent = 'เชื่อมต่อไม่ได้ จะลองใหม่อัตโนมัติ';
  }
}
load();
setInterval(load, REFRESH_SECONDS * 1000);
</script>
</body>
</html>
